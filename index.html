<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Expense Tracker</h1>
        <form id="expense-form">
            <div class="form-control">
                <label for="description">Description</label>
                <input type="text" id="description" required>
            </div>
            <div class="form-control">
                <label for="category">Category</label>
                <select id="category" required>
                    <option value="food">Food</option>
                    <option value="transport">Transport</option>
                    <option value="entertainment">Entertainment</option>
                    <option value="bills">Bills</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="form-control">
                <label for="amount">Amount ($)</label>
                <input type="number" id="amount" min="0.01" step="0.01" required>
            </div>
            <button type="submit">Add Expense</button>
        </form>

        <div class="budget-summary">
            <label for="budget-input">Set Budget ($): </label>
            <input type="number" id="budget-input" min="0" step="0.01" value="0">
            <p>Total Spent: $<span id="total-spent">0.00</span></p>
            <p>Remaining Balance: $<span id="remaining-balance">0.00</span></p>
        </div>

        <ul id="expense-list"></ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
